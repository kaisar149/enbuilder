[package]
name = "enbuilder"
version = "0.1.0"
edition = "2024"
description = "Part 1 foundations: Domain, meshes, FieldStore, module scheduler (no physics yet)"

[features]
default = []
# GPU compute path (Part 3c-2). The default build stays std-only.
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
# Default build: std only. glam/rayon arrive in later parts.
wgpu = { version = "23", optional = true }
pollster = { version = "0.4", optional = true }

[profile.test]
opt-level = 2
