[package]
name = "wb-app"
version = "0.1.0"
edition = "2021"
description = "Part 9a: headless app core (session, commands, queries, events, jobs, undo), schema export and PNG snapshots"

[dependencies]
enbuilder = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "wb-snap"
path = "src/bin/wb-snap.rs"
